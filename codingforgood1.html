<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Password Generator | Coding4Good</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr;height:100vh}
  #editor{position:relative;border-right:1px solid #ddd}
  #code,#hl,#gutter{position:absolute;inset:0 0 0 44px;margin:0;border:0;padding:12px 12px 60px;box-sizing:border-box;
            font:14px/1.5 ui-monospace,monospace;white-space:pre;overflow:auto}
  #code{background:transparent;color:transparent;caret-color:#000;resize:none}
  #hl,#gutter{overflow:hidden;pointer-events:none;padding-bottom:90px;padding-right:40px}
  #hl{color:#222}
  #gutter{left:0;right:auto;width:44px;padding-right:8px;text-align:right;color:#aaa;background:#f6f6f8;user-select:none}
  .c{color:#8a8f98}
  .s{color:#0a7f3f}
  .k{color:#8250df}
  .n{color:#c2410c}
  #out{height:100vh;overflow:auto;box-sizing:border-box;padding:12px 12px 60px;background:#111;color:#e8e8e8;
       font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  .line{white-space:pre-wrap;padding:2px 0;border-bottom:1px solid #1e1e1e}
  .warn{color:#ffd166}
  .err{color:#ff8a8a}
  #bar{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:8px;display:flex;gap:8px;align-items:center}
  #msg{opacity:.7;font-size:13px}
  #steps{display:flex;gap:4px;margin-right:12px}
  #steps button[aria-pressed="true"]{background:#ffd166;font-weight:bold}
</style>

<div id="editor">
  <pre id="gutter" aria-hidden="true"></pre>
  <pre id="hl" aria-hidden="true"></pre>
  <textarea id="code" spellcheck="false" wrap="off"></textarea>
</div>
<div id="out" role="log" aria-label="Output"></div>

<div id="bar">
  <span id="steps"></span>
  <button onclick="run()">▶ Run (Ctrl+Enter)</button>
  <button onclick="reset()">↺ Reset</button>
  <button onclick="copyOut()">⧉ Copy my code</button>
  <span id="msg"></span>
</div>

<script>
const KEY = "codingforgood1";
const ta  = document.getElementById("code");
const hl  = document.getElementById("hl");
const gutter = document.getElementById("gutter");
const out = document.getElementById("out");
const msg = document.getElementById("msg");
const stepsBar = document.getElementById("steps");
const STARTERS = [...document.querySelectorAll(".starter")].map(s => s.textContent.trim());
const codeKey = n => `${KEY}-step${n}`;

// localStorage throws when the browser blocks site data; the lesson should still work, just without saving.
const storage = {
  get(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); return true; } catch { return false; }
  },
};

let step = Number(storage.get(`${KEY}-current`)) || 0;

const TIME_LIMIT_SECONDS = 3;
const MAX_LINES = 500;

// Runs in a Web Worker ahead of the student's code, so console output is sent back to this page.
const PRELUDE = `(() => {
  let lines = 0;
  function fmt(v) {
    if (typeof v === "string") return v;
    try { return JSON.stringify(v) ?? String(v); } catch (e) { return String(v); }
  }
  function show(kind, args) {
    lines++;
    if (lines <= ${MAX_LINES}) self.postMessage({ kind, text: args.map(fmt).join(" ") });
    else if (lines === ${MAX_LINES} + 1) self.postMessage({ kind: "warn", text: "✋ Too many lines! Only showing the first ${MAX_LINES}." });
  }
  console.log = console.info = console.debug = (...args) => show("", args);
  console.warn = (...args) => show("warn", args);
  console.error = (...args) => show("err", args);
  setTimeout(() => self.postMessage({ done: true }));
})();
`;
const LINE_OFFSET = PRELUDE.split("\n").length - 1;
let worker, timer, workerUrls = [];

const TOKENS = new RegExp([
  /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/.source,
  /("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)/.source,
  /\b(let|const|var|function|return|for|while|if|else|new|true|false|null|undefined)\b/.source,
  /\b\d+(?:\.\d+)?\b/.source,
].join("|"), "g");

const escapeHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function render() {
  hl.innerHTML = escapeHtml(ta.value).replace(TOKENS, (m, comment, string, keyword) =>
    `<span class="${comment ? "c" : string ? "s" : keyword ? "k" : "n"}">${m}</span>`) + "\n";
  gutter.textContent = ta.value.split("\n").map((_, i) => i + 1).join("\n");
  syncScroll();
}

function syncScroll() {
  hl.scrollTop = gutter.scrollTop = ta.scrollTop;
  hl.scrollLeft = ta.scrollLeft;
}

function load(code) {
  ta.value = code;
  render();
}

function save() {
  return storage.set(codeKey(step), ta.value);
}

function print(kind, text) {
  const line = document.createElement("div");
  line.className = `line ${kind}`;
  line.textContent = text;
  out.appendChild(line);
}

function printError(message, line) {
  print("err", `💥 ${message}` + (line > 0 ? ` (line ${line})` : ""));
}

function scriptUrl(source) {
  const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
  workerUrls.push(url);
  return url;
}

function startWorker(source) {
  worker?.terminate();
  worker = new Worker(scriptUrl(source));
  return worker;
}

function stop() {
  clearTimeout(timer);
  worker?.terminate();
  workerUrls.forEach(url => URL.revokeObjectURL(url));
  workerUrls = [];
}

// Firefox and Safari don't say why a worker's script failed to parse, so parse the student's code alone to find out.
// It already failed to parse, so it can't run; the run's time limit still applies just in case.
function explainSyntaxError(code) {
  const checker = startWorker(`try { importScripts("${scriptUrl(code)}"); }
    catch (e) { self.postMessage({ message: e.name + ": " + e.message, line: e.lineNumber ?? e.line }); }`);
  checker.onmessage = ({ data }) => {
    clearTimeout(timer);
    printError(data.message, data.line);
  };
}

function run() {
  const saved = save();
  stop();
  out.replaceChildren();

  const code = ta.value;
  startWorker(PRELUDE + code);
  worker.onmessage = ({ data }) => data.done ? clearTimeout(timer) : print(data.kind, data.text);
  worker.onerror = e => {
    e.preventDefault();
    if (!e.message) return explainSyntaxError(code);
    clearTimeout(timer);
    printError(e.message, e.lineno - LINE_OFFSET);
  };
  timer = setTimeout(() => {
    worker.terminate();
    print("err", `⏰ Stopped after ${TIME_LIMIT_SECONDS} seconds. Is there a loop that never ends?`);
  }, TIME_LIMIT_SECONDS * 1000);

  msg.textContent = saved ? "saved in this browser" : "not saved — this browser is blocking storage, so use Copy my code";
}

function reset() {
  load(STARTERS[step]);
  run();
}

function showStep(n) {
  step = n;
  storage.set(`${KEY}-current`, n);
  load(storage.get(codeKey(n)) ?? STARTERS[n]);
  stepsBar.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", i === n));
  run();
}

document.querySelectorAll(".starter").forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = `Step ${i + 1}`;
  b.title = s.dataset.title;
  b.onclick = () => showStep(i);
  stepsBar.appendChild(b);
});

async function copyOut() {
  try {
    await navigator.clipboard.writeText(ta.value);
    msg.textContent = `copied step ${step + 1} — paste it in the assignment`;
  } catch {
    ta.focus();
    ta.select();
    msg.textContent = "couldn't copy — your code is selected, press Ctrl+C (⌘C on Mac) to copy it";
  }
}

ta.addEventListener("input", () => { save(); render(); });
ta.addEventListener("scroll", syncScroll);
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});
showStep(step);
</script>
</html>
